spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aftercare}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # e.g. https://<tenant>.ca.auth0.com/
          issuer-uri: ${AUTH0_ISSUER_URI}

auth0:
  audience: ${AUTH0_AUDIENCE}

logging:
  level:
    root: INFO
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
    org:
      springframework:
        web: INFO
        security: INFO

server:
  port: 8080
  tomcat:
    # so a too-large upload still gets a 413 body instead of a connection reset
    max-swallow-size: 20MB

# Comma-separated list of frontend origins allowed to call the API
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

aftercare:
  timezone: America/Toronto
  questionnaires:
    location: classpath:questionnaires/*.json
  phi:
    # Base64 of 32 random bytes (openssl rand -base64 32). Required: startup fails without it.
    key: ${PHI_ENCRYPTION_KEY:}
