spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database: h2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://test-issuer.invalid/

auth0:
  audience: https://aftercare-api.test
