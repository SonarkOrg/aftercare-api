spring:
  web:
    locale: en_CA
    locale-resolver: fixed
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database: h2
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor},classpath:db/migration/common
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://test-issuer.invalid/

auth0:
  audience: https://aftercare-api.test

aftercare:
  timezone: America/Toronto
  frontend-base-url: https://app.test
  jobs:
    enabled: false          # tests call the jobs' runOnce() directly with a MutableClock
  rate-limit:
    enabled: false          # switched on only by PublicRateLimitTests
  questionnaires:
    location: classpath:questionnaires/*.json
  phi:
    key: dGVzdC1vbmx5LXBoaS1rZXktMzItYnl0ZXMtISEhISE=
