spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database: h2
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://test-issuer.invalid/

auth0:
  audience: https://aftercare-api.test

aftercare:
  timezone: America/Toronto
  questionnaires:
    location: classpath:questionnaires/*.json
  phi:
    key: dGVzdC1vbmx5LXBoaS1rZXktMzItYnl0ZXMtISEhISE=
